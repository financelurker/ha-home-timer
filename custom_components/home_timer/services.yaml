start:
  target:
    entity:
      integration: home_timer
  fields:
    preset:
      example: Rice
      selector:
        text:
    name:
      example: Let dough rest
      selector:
        text:
    duration:
      example: "00:30:00"
      selector:
        duration:
    note:
      example: Cover with a towel
      selector:
        text:
    source:
      example: '{"my_script": {"step": 2}}'
      selector:
        object:

pause:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id: &timer_id
      example: 01JD7Q0000000000000000000
      selector:
        text:

resume:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id: *timer_id

add_time:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id: *timer_id
    duration: &time
      required: true
      example: "00:01:00"
      selector:
        duration:

subtract_time:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id: *timer_id
    duration: *time

cancel:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id: *timer_id

acknowledge:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id:
      example: 01JD7Q0000000000000000000
      selector:
        text:

assign:
  target:
    entity:
      integration: home_timer
  fields:
    timer_id:
      required: true
      example: 01JD7Q0000000000000000000
      selector:
        text:
